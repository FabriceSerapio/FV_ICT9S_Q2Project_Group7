<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll Now | Q2 Project</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
      /*YOU CAN EDIT THIS*/
      .form-row{
        display: flex;
        gap: 1.5rem;
      }

      .form-group{
        display: flex;
        flex-direction: column;
      }

      input[type="text"]{
        border: 0.5px solid;
        border-color: grey;
        border-radius: 50px;
        width: 300px;
        height: 35px;
        transition: 0.5s ease;
      }
      input[type="text"]:hover {
        border-color: rgb(0, 0, 0);
      }

      input[type="date"]{
        border: 1px solid;
        border-color: grey;
        border-radius: 50px;
        width: 192px;
        height: 35px;
        transition: 0.5s ease;
        text-align: center;
      }

      select{
        border: 1px solid;
        border-color: grey;
        border-radius: 50px;
        width: 192px;
        height: 35px;
        transition: 0.5s ease;
        text-align: center;
        background-color: rgb(249, 249, 249);
      }

      input{
        background-color: rgb(249, 249, 249);
      }

      #email, #number{
        width: 625px;
      }
    </style>
</head>

<body>

<nav id="topnav" class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">

        <a class="navbar-brand" href="index.html">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSffsm2n4xf-Ake_7FjbIElN4zOydP5HGxF899j-8bZJQ&s=10"
            alt="OBMC Logo" class="img-fluid rounded-circle">
        </a>

        <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse" data-bs-target="#mynavbar"
        aria-controls="mynavbar" aria-expanded="false"
        aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mynavbar">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="page2.html">Courses Offer</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="page3.html">Enroll Now</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="page4.html">Contact Us</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="page5.html">About the Group Members</a>
                </li>

            </ul>

            <div class="d-flex">
                <a href="https://obmontessori.orangeapps.ph/landing/obmontessori/"
                class="btn btn-primary">My Portal</a>
            </div>

        </div>
    </div>
</nav>

<main class="container mt-4">

    <div id="enroll">
      <div id="enroll-title">
        <h1>Enrollment Form</h1>
      </div>
    
      <div id="enroll-content">
        <p>Welcome to O.B. Montessori Center! Complete this quick form to start your child's enrollment for the upcoming school year.</p>
    
        <img  class="rounded-circle" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRnWHJT7Dj_pCvneMp-L1rmmHbPixBNPz-Ig7AswGn7G4LPu3xqQE6okPg&s=10" alt="OBMC Logo">
    
        <form>
          <h5>Student Information</h5>
    
          <div class="form-row">
            <div class="form-group">
              <label for="fname">First Name</label>
              <input type="text" id="fname" name="fname">
            </div>
            <div class="form-group">
            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lname">
            </div>
          </div>
    
          <br>
          <div class="form-row">
            <div class="form-group">
              <label for="bday">Birth Date</label>
              <input type="date" id="bday" name="bday">
            </div>
            <div class="form-group">
              <label for="gender">Gender</label>
              <select>
                <option value="">Select...</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="grade">Grade Level</label>
              <select>
                <option value="">Select...</option>
                <option value="casa">Casa</option>
                <option value="juniorcasa">Junior Casa</option>
                <option value="junioradvancedcasa">Junior Advanced Casa</option>
                <option value="advancedcasa">Advanced Casa</option>
                <option value="grade1">Grade 1</option>
                <option value="grade2">Grade 2</option>
                <option value="grade3">Grade 3</option>
                <option value="grade4">Grade 4</option>
                <option value="grade5">Grade 5</option>
                <option value="grade6">Grade 6</option>
                <option value="grade7">Grade 7</option>
                <option value="grade8">Grade 8</option>
                <option value="grade9">Grade 9</option>
                <option value="grade10">Grade 10</option>
                <option value="grade11">Grade 11</option>
                <option value="grade12">Grade 12</option>
              </select>
            </div>
          </div>
    
          <br>
          <h5>Contact Details</h5>
            
          <label for="email">Email</label>
          <br>
          <input type="text" id="email" name="email">
    
          <br><br>
          <label for="number">Contact Number</label>
          <br>
          <input type="text" id="number" name="number">
        </form>
      </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
